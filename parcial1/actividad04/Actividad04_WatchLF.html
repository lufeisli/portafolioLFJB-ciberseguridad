<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WatchLF - Sesión Expirada</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-emerald-950 flex items-center justify-center p-4 font-sans selection:bg-green-200 selection:text-emerald-900">
    <div class="max-w-md w-full bg-emerald-900/40 backdrop-blur-lg rounded-3xl shadow-2xl p-8 sm:p-10 border border-green-200/10">
        <div class="mb-6 p-4 rounded-2xl bg-amber-500/10 border border-amber-400/30 text-amber-200 flex items-center gap-3 text-sm">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
            <span>Tu sesión ha expirado por inactividad. Por favor, vuelve a ingresar tu cuenta.</span>
        </div>
        <div class="text-center mb-8">
            <h1 class="text-5xl font-extrabold text-green-200 tracking-tighter mb-2">WatchLF</h1>
            <p class="text-green-100/60 text-sm font-medium tracking-widest uppercase">Inicio de Sesión</p>
        </div>
        <form action="" method="" class="space-y-6">
            <div>
                <label for="email" class="block text-sm font-medium text-green-200 mb-2 ml-1">Correo electrónico o Usuario</label>
                <input type="email" id="email" name="email" class="w-full px-5 py-3.5 rounded-2xl bg-emerald-950/60 border border-green-200/20 text-green-50 placeholder-green-100/30 focus:outline-none focus:border-green-200 focus:ring-1 focus:ring-green-200 transition-all duration-300" placeholder="usuario@watchlf.com" required>
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-green-200 mb-2 ml-1">Contraseña</label>
                <input type="password" id="password" name="password" class="w-full px-5 py-3.5 rounded-2xl bg-emerald-950/60 border border-green-200/20 text-green-50 placeholder-green-100/30 focus:outline-none focus:border-green-200 focus:ring-1 focus:ring-green-200 transition-all duration-300" placeholder="••••••••" required>
            </div>
            <button class="w-full bg-green-200 hover:bg-green-300 text-emerald-950 font-black text-lg py-4 px-4 rounded-2xl transition-all duration-300 transform hover:-translate-y-1 hover:shadow-[0_0_25px_rgba(187,247,208,0.25)] active:scale-95 mt-4">
                Reingresar a WatchLF
            </button>
        </form>
    </div>
</body>
</html>
